[package]
name = "qism-natijah"
version = "1.0.0"
description = "Qism Natijah - Pencatat Point Santri (desktop, offline)"
authors = ["Qism Natijah"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
bcrypt = "0.15"
rust_xlsxwriter = "0.76"
chrono = { version = "0.4", features = ["serde"] }

[features]
# this feature is used for production builds where `devUrl` is disabled
custom-protocol = ["tauri/custom-protocol"]
